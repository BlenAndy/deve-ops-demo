name: Python Calculator CI/CD Pipeline

on: [push, pull_request]

jobs:
  # PARALLEL TEST JOBS - All run simultaneously
  
  test-addition:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run Addition Tests
      run: python test_addition.py
    - name: Addition Test Passed
      run: echo "✅ Addition tests passed"

  test-subtraction:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run Subtraction Tests
      run: python test_subtraction.py
    - name: Subtraction Test Passed
      run: echo "✅ Subtraction tests passed"

  test-multiplication:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run Multiplication Tests
      run: python test_multiplication.py
    - name: Multiplication Test Passed
      run: echo "✅ Multiplication tests passed"

  test-division:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run Division Tests
      run: python test_division.py
    - name: Division Test Passed
      run: echo "✅ Division tests passed"

  test-power:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run Power Tests
      run: |
        python -c "
from calculator import power
assert power(2,3)==8, '2^3 should be 8'
assert power(5,0)==1, '5^0 should be 1'
assert power(10,2)==100, '10^2 should be 100'
print('✅ Power tests passed')
        "

  test-even:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run Even Number Tests
      run: |
        python -c "
from calculator import is_even
assert is_even(2)==True, '2 should be even'
assert is_even(4)==True, '4 should be even'
assert is_even(3)==False, '3 should be odd'
assert is_even(7)==False, '7 should be odd'
print('✅ Even number tests passed')
        "

  test-comprehensive:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run All Tests Together
      run: python test_calculator.py

  # FINAL REPORT - Runs after ALL parallel tests complete
  final-report:
    runs-on: ubuntu-latest
    needs: [test-addition, test-subtraction, test-multiplication, test-division, test-power, test-even, test-comprehensive]
    if: always()
    steps:
    - name: Generate Final Report
      run: |
        echo "=========================================="
        echo "🎉 ALL 7 PARALLEL TEST SUITES COMPLETED! 🎉"
        echo "=========================================="
        echo ""
        echo "Test Results Summary:"
        echo "✅ Addition tests (parallel job 1)"
        echo "✅ Subtraction tests (parallel job 2)"
        echo "✅ Multiplication tests (parallel job 3)"
        echo "✅ Division tests (parallel job 4)"
        echo "✅ Power tests (parallel job 5)"
        echo "✅ Even number tests (parallel job 6)"
        echo "✅ Comprehensive tests (parallel job 7)"
        echo ""
        echo "All test suites executed in parallel!"
        echo "Total execution time = time of slowest test only"